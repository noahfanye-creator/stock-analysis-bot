<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanInvest - 欢迎来到我的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
            font-weight: 300;
        }

        .status {
            display: inline-block;
            background: rgba(76, 175, 80, 0.3);
            padding: 12px 30px;
            border-radius: 50px;
            margin: 20px 0;
            font-size: 1.1rem;
            border: 2px solid rgba(76, 175, 80, 0.5);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .info-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .info-card p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .date {
            font-size: 1rem;
            margin-top: 20px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>FanInvest</h1>
        <p class="subtitle">欢迎来到我的个人网站</p>
        
        <div class="status">
            ✅ 网站运行正常
        </div>

        <div class="info-grid">
            <div class="info-card">
                <h3>🌐 域名</h3>
                <p>faninvest.com</p>
            </div>
            <div class="info-card">
                <h3>🖥️ 服务器</h3>
                <p>154.17.3.182</p>
            </div>
            <div class="info-card">
                <h3>🔒 安全</h3>
                <p>HTTPS 已启用</p>
            </div>
            <div class="info-card">
                <h3>⚡ 状态</h3>
                <p>在线运行中</p>
            </div>
        </div>

        <div class="footer">
            <p>这是我的第一个网站，很高兴你能访问！</p>
            <p class="date" id="currentDate"></p>
        </div>
    </div>

    <script>
        // 显示当前日期
        const date = new Date();
        const options = { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            weekday: 'long'
        };
        document.getElementById('currentDate').textContent = 
            '今天是 ' + date.toLocaleDateString('zh-CN', options);
    </script>
</body>
</html>
